<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>記帳儀表板</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌸 記帳儀表板</h1>
    <p class="sub">支出現況 × 收入試算</p>
    <p class="updated" id="updated-at"></p>
  </header>

  <main>
    <!-- ═══ 本月支出現況 ═══ -->
    <section class="cards" id="summary-cards">
      <div class="card">
        <div class="card-label">本月支出</div>
        <div class="card-value" id="month-total">—</div>
        <div class="card-note" id="month-range"></div>
      </div>
      <div class="card">
        <div class="card-label">日均花費</div>
        <div class="card-value" id="daily-avg">—</div>
        <div class="card-note">本月已過天數平均</div>
      </div>
      <div class="card">
        <div class="card-label">月底預估</div>
        <div class="card-value accent" id="month-projection">—</div>
        <div class="card-note">按目前日均推算整月</div>
      </div>
      <div class="card">
        <div class="card-label">月均基準</div>
        <div class="card-value" id="baseline">—</div>
        <div class="card-note">所有歷史月份平均</div>
      </div>
    </section>

    <section class="grid-2">
      <div class="panel">
        <h2>分類佔比（本月）</h2>
        <div class="chart-box"><canvas id="pie-chart"></canvas></div>
        <p class="empty-hint" id="pie-empty" hidden>本月還沒有資料</p>
      </div>
      <div class="panel">
        <h2>近 30 天趨勢</h2>
        <div class="chart-box"><canvas id="trend-chart"></canvas></div>
      </div>
    </section>

    <section class="panel">
      <h2>每月總支出</h2>
      <div class="chart-box tall"><canvas id="monthly-chart"></canvas></div>
    </section>

    <!-- ═══ 預估與收入試算 ═══ -->
    <section class="panel">
      <h2>💰 預估與收入試算</h2>
      <p class="panel-desc">調整下面的數字，即時算出「要維持你想要的生活，實際上要賺多少」。稅務用台灣綜所稅級距粗算，不含扣除額。</p>
      <div class="estimator">
        <div class="inputs">
          <div class="input-head">
            <span>支出預估表</span>
            <button type="button" class="mini-btn" id="add-item">＋ 新增項目</button>
          </div>
          <div id="budget-list"></div>
          <div class="result-row total-row">
            <span class="r-label">合計月支出</span>
            <span class="r-value" id="budget-total">$0</span>
          </div>
          <label>預估月收入（稅前）
            <div class="input-row">
              <span class="unit">$</span>
              <input type="number" id="in-income" min="0" step="1000" placeholder="例如 45000">
            </div>
          </label>
          <label>通膨年增率
            <div class="input-row">
              <input type="number" id="in-inflation" min="0" max="20" step="0.5" value="2">
              <span class="unit-r">%</span>
            </div>
          </label>
          <label>看幾年後
            <div class="input-row">
              <input type="number" id="in-years" min="0" max="40" step="1" value="0">
              <span class="unit-r">年</span>
            </div>
          </label>
        </div>
        <div class="results" id="estimator-results">
          <div class="result-row">
            <span class="r-label">現況基準（實際月均）</span>
            <span class="r-value" id="r-baseline">—</span>
          </div>
          <div class="result-row">
            <span class="r-label">理想支出（<span id="r-years-label">今年</span>）</span>
            <span class="r-value" id="r-ideal">—</span>
          </div>
          <div class="result-row">
            <span class="r-label">收入稅後月可支配</span>
            <span class="r-value" id="r-net">—</span>
          </div>
          <div class="result-row">
            <span class="r-label">稅務試算（年收入 × 級距粗算）</span>
            <span class="r-value small" id="r-tax">—</span>
          </div>
          <div class="result-row highlight">
            <span class="r-label">要過理想生活，稅前月收入需</span>
            <span class="r-value big" id="r-needed">—</span>
          </div>
          <div class="verdict" id="r-verdict"></div>
        </div>
      </div>
    </section>
  </main>

  <footer>資料來源：Google Sheets「記帳」・每日自動同步</footer>
</div>
<script src="app.js"></script>
</body>
</html>
