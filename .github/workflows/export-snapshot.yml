name: Export expense snapshot

on:
  schedule:
    - cron: '40 21 * * *'   # 每天 05:40 台北時間
  workflow_dispatch: {}      # 手動觸發

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install google-api-python-client google-auth

      - name: Export snapshot
        env:
          EXPENSE_SHEET_ID: ${{ secrets.EXPENSE_SHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa.json
        run: |
          echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > sa.json
          python scripts/export_snapshot.py
          rm sa.json

      - name: Commit snapshot
        run: |
          git config user.name "snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/data.json
          git diff --cached --quiet || git commit -m "chore: update data snapshot"
          git push
